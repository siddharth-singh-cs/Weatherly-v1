<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weatherly – Your Weather. Your Way.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       CSS VARIABLES & RESET
    ============================================= */
    :root {
      --primary: #1a6fd4;
      --primary-light: #3d9be9;
      --primary-dark: #0e4fa0;
      --accent: #38bdf8;
      --sun: #fbbf24;
      --navy: #0f1c3f;
      --navy-mid: #1a2d5a;
      --glass: rgba(255,255,255,0.14);
      --glass-border: rgba(255,255,255,0.25);
      --glass-hover: rgba(255,255,255,0.22);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.72);
      --text-muted: rgba(255,255,255,0.5);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.18);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: 0.35s cubic-bezier(0.4,0,0.2,1);
      --bg-gradient: linear-gradient(135deg, #1a6fd4 0%, #0e4fa0 40%, #0a3070 100%);
      --font-display: 'Nunito', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    /* Dark mode overrides */
    [data-theme="dark"] {
      --glass: rgba(15,28,63,0.55);
      --glass-border: rgba(255,255,255,0.12);
      --glass-hover: rgba(15,28,63,0.70);
      --bg-gradient: linear-gradient(135deg, #0a1628 0%, #0e2041 45%, #05101f 100%);
      --text-secondary: rgba(180,210,255,0.80);
      --text-muted: rgba(140,180,255,0.55);
    }

    /* Weather condition backgrounds */
    .bg-clear      { --bg-gradient: linear-gradient(135deg,#1a6fd4 0%,#38bdf8 50%,#0ea5e9 100%); }
    .bg-clouds     { --bg-gradient: linear-gradient(135deg,#4a6fa5 0%,#6b8fc4 45%,#3a5a8a 100%); }
    .bg-rain       { --bg-gradient: linear-gradient(135deg,#1a2d5a 0%,#253d6b 50%,#0f1c3f 100%); }
    .bg-thunderstorm{ --bg-gradient: linear-gradient(135deg,#0d1117 0%,#1a1f2e 50%,#0a0d15 100%); }
    .bg-snow       { --bg-gradient: linear-gradient(135deg,#b8d4f0 0%,#d6e8f8 50%,#a0c4e8 100%); --text-primary:#0f1c3f; --text-secondary:rgba(15,28,63,0.72); --text-muted:rgba(15,28,63,0.50); }
    .bg-mist       { --bg-gradient: linear-gradient(135deg,#6b7fa0 0%,#8a9bba 50%,#5a6d90 100%); }
    [data-theme="dark"].bg-clear      { --bg-gradient: linear-gradient(135deg,#0a2040 0%,#0d3060 50%,#061525 100%); }
    [data-theme="dark"].bg-clouds     { --bg-gradient: linear-gradient(135deg,#0d1a2e 0%,#162030 50%,#0a1220 100%); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #38bdf8, transparent 70%);
      top: -100px; left: -150px;
      animation: blobFloat 12s ease-in-out infinite;
    }
    body::after {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #fbbf24, transparent 70%);
      bottom: -100px; right: -100px;
      animation: blobFloat 15s ease-in-out infinite reverse;
    }
    @keyframes blobFloat {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-40px) scale(1.05); }
      66% { transform: translate(-20px,20px) scale(0.97); }
    }

    /* =============================================
       LAYOUT
    ============================================= */
    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* =============================================
       HEADER / LOGO
    ============================================= */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 36px;
      animation: fadeDown 0.6s ease both;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* SVG logo inline mirroring the uploaded image */
    .logo-icon {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
    }

    .logo-text-group { display: flex; flex-direction: column; }
    .logo-name {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .logo-name span { color: var(--accent); }
    .logo-tagline {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* Dark mode toggle */
    .toggle-btn {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      width: 46px; height: 46px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .toggle-btn:hover {
      background: var(--glass-hover);
      transform: scale(1.1) rotate(20deg);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
    }

    /* =============================================
       SEARCH BAR
    ============================================= */
    .search-section { animation: fadeUp 0.6s 0.1s ease both; }

    .search-box {
      display: flex;
      gap: 10px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 60px;
      padding: 8px 8px 8px 22px;
      box-shadow: var(--card-shadow);
      transition: box-shadow var(--transition), border-color var(--transition);
    }
    .search-box:focus-within {
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 0 0 3px rgba(56,189,248,0.25), var(--card-shadow);
    }

    #searchInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 1rem;
      font-weight: 500;
    }
    #searchInput::placeholder { color: var(--text-muted); }

    .btn {
      border: none;
      cursor: pointer;
      font-family: var(--font-display);
      font-weight: 700;
      border-radius: 50px;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
      color: #fff;
      padding: 12px 26px;
      font-size: 0.92rem;
      box-shadow: 0 4px 15px rgba(14,79,160,0.4);
    }
    .btn-primary:hover { transform: scale(1.04); box-shadow: 0 6px 20px rgba(14,79,160,0.55); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .btn-location {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      padding: 12px 20px;
      font-size: 0.88rem;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      gap: 6px;
      display: flex; align-items: center;
    }
    .btn-location:hover {
      background: var(--glass-hover);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.2);
    }

    .search-actions {
      display: flex;
      gap: 10px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    /* Recent searches */
    .recent-searches {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      animation: fadeUp 0.4s ease both;
    }
    .recent-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      width: 100%;
    }
    .recent-chip {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all var(--transition);
    }
    .recent-chip:hover {
      background: var(--glass-hover);
      color: var(--text-primary);
      transform: translateY(-2px);
    }

    /* Error message */
    .error-msg {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.4);
      color: #fca5a5;
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      margin-top: 14px;
      font-size: 0.9rem;
      display: none;
      animation: shake 0.4s ease;
    }
    .error-msg.show { display: block; }
    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      20%{ transform:translateX(-8px); }
      40%{ transform:translateX(8px); }
      60%{ transform:translateX(-5px); }
      80%{ transform:translateX(5px); }
    }

    /* =============================================
       LOADING SPINNER
    ============================================= */
    .loading-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }
    .loading-overlay.show { display: flex; }
    .spinner {
      width: 52px; height: 52px;
      border: 4px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text-secondary); font-size: 0.95rem; }

    /* =============================================
       MAIN WEATHER CONTENT
    ============================================= */
    #weatherContent { display: none; }
    #weatherContent.show { display: block; }

    /* =============================================
       CURRENT WEATHER (hero card)
    ============================================= */
    .current-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 36px 36px 28px;
      margin-top: 28px;
      box-shadow: var(--card-shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: start;
      animation: fadeUp 0.5s ease both;
      transition: transform var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }
    .current-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .current-card:hover { transform: translateY(-3px); box-shadow: 0 16px 48px rgba(0,0,0,0.25); }

    .current-location { font-size: 1.1rem; color: var(--text-secondary); font-weight: 500; }
    .current-city { font-family: var(--font-display); font-size: 2.4rem; font-weight: 900; line-height: 1.1; }
    .current-country { font-size: 0.9rem; color: var(--text-muted); margin-top: 2px; }
    .current-temp {
      font-family: var(--font-display);
      font-size: 5rem;
      font-weight: 900;
      line-height: 1;
      margin-top: 12px;
      background: linear-gradient(180deg, #fff 40%, rgba(255,255,255,0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .current-condition { font-size: 1.05rem; color: var(--text-secondary); text-transform: capitalize; margin-top: 6px; }
    .current-feels { font-size: 0.88rem; color: var(--text-muted); margin-top: 4px; }

    .current-icon-area { text-align: center; padding-top: 8px; }
    .current-icon-area img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,0.3));
      animation: floatIcon 4s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-8px); }
    }

    /* Quick stats strip */
    .quick-stats {
      display: flex;
      gap: 20px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.12);
      flex-wrap: wrap;
    }
    .qs-item { display: flex; align-items: center; gap: 7px; }
    .qs-icon { font-size: 1rem; opacity: 0.8; }
    .qs-label { font-size: 0.78rem; color: var(--text-muted); }
    .qs-val { font-size: 0.9rem; font-weight: 600; }

    /* =============================================
       DETAIL CARDS GRID
    ============================================= */
    .section-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 32px 0 14px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
    }

    .detail-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-sm);
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeUp 0.4s ease both;
      transition: transform var(--transition), background var(--transition), box-shadow var(--transition);
      position: relative;
      overflow: hidden;
    }
    .detail-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.5;
    }
    .detail-card:hover {
      transform: translateY(-4px);
      background: var(--glass-hover);
      box-shadow: 0 12px 32px rgba(0,0,0,0.18);
    }
    .detail-icon { font-size: 1.5rem; }
    .detail-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .detail-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; }
    .detail-sub { font-size: 0.75rem; color: var(--text-muted); }

    /* =============================================
       HOURLY FORECAST
    ============================================= */
    .hourly-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }
    .hourly-scroll::-webkit-scrollbar { height: 4px; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    .hourly-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 85px;
      flex-shrink: 0;
      transition: transform var(--transition), background var(--transition);
      animation: fadeUp 0.4s ease both;
      cursor: default;
    }
    .hourly-card:hover { transform: translateY(-3px); background: var(--glass-hover); }
    .hourly-time { font-size: 0.78rem; color: var(--text-muted); font-weight: 600; }
    .hourly-card img { width: 38px; height: 38px; }
    .hourly-temp { font-family: var(--font-display); font-size: 1rem; font-weight: 800; }

    /* =============================================
       5-DAY FORECAST
    ============================================= */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }

    .forecast-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-sm);
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: fadeUp 0.4s ease both;
      transition: transform var(--transition), background var(--transition), box-shadow var(--transition);
    }
    .forecast-card:hover {
      transform: translateY(-5px);
      background: var(--glass-hover);
      box-shadow: 0 14px 36px rgba(0,0,0,0.2);
    }
    .forecast-day { font-family: var(--font-display); font-size: 0.88rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
    .forecast-card img { width: 52px; height: 52px; }
    .forecast-condition { font-size: 0.75rem; color: var(--text-muted); text-align: center; text-transform: capitalize; }
    .forecast-temps { display: flex; gap: 10px; align-items: baseline; }
    .forecast-max { font-family: var(--font-display); font-size: 1.15rem; font-weight: 800; }
    .forecast-min { font-size: 0.88rem; color: var(--text-muted); }

    /* =============================================
       SUNRISE / SUNSET CARD (special)
    ============================================= */
    .sun-card {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-sm);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 20px;
      animation: fadeUp 0.4s ease both;
      transition: transform var(--transition);
    }
    .sun-card:hover { transform: translateY(-3px); }
    .sun-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .sun-icon { font-size: 2rem; }
    .sun-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .sun-time { font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; }
    .sun-divider { width: 1px; height: 60px; background: rgba(255,255,255,0.15); }

    /* =============================================
       ANIMATIONS
    ============================================= */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Staggered animation delays for cards */
    .detail-card:nth-child(1) { animation-delay: 0.05s; }
    .detail-card:nth-child(2) { animation-delay: 0.1s; }
    .detail-card:nth-child(3) { animation-delay: 0.15s; }
    .detail-card:nth-child(4) { animation-delay: 0.2s; }
    .detail-card:nth-child(5) { animation-delay: 0.25s; }
    .detail-card:nth-child(6) { animation-delay: 0.3s; }
    .forecast-card:nth-child(1) { animation-delay: 0.05s; }
    .forecast-card:nth-child(2) { animation-delay: 0.1s; }
    .forecast-card:nth-child(3) { animation-delay: 0.15s; }
    .forecast-card:nth-child(4) { animation-delay: 0.2s; }
    .forecast-card:nth-child(5) { animation-delay: 0.25s; }

    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (max-width: 680px) {
      .current-card { grid-template-columns: 1fr; padding: 26px 22px 20px; }
      .current-icon-area { display: flex; justify-content: flex-start; }
      .current-icon-area img { width: 80px; height: 80px; }
      .current-temp { font-size: 3.8rem; }
      .current-city { font-size: 1.8rem; }
      .logo-name { font-size: 1.5rem; }
      .logo-icon { width: 42px; height: 42px; }
      .search-actions { flex-direction: column; }
      .btn-location, .btn-primary { width: 100%; justify-content: center; }
      .forecast-grid { grid-template-columns: repeat(3, 1fr); }
      .details-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* Welcome placeholder */
    .welcome-state {
      text-align: center;
      padding: 60px 20px;
      animation: fadeIn 0.6s ease;
    }
    .welcome-state .w-icon { font-size: 4rem; margin-bottom: 16px; }
    .welcome-state h2 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; }
    .welcome-state p { color: var(--text-muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- ===== HEADER ===== -->
    <header>
      <div class="logo-area">
        <!-- Inline SVG logo matching the uploaded design -->
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="50" fill="url(#circleBg)"/>
          <!-- Sun -->
          <circle cx="38" cy="36" r="13" fill="url(#sunGrad)"/>
          <!-- Sun rays -->
          <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
            <line x1="38" y1="17" x2="38" y2="12"/>
            <line x1="25" y1="22" x2="21" y2="18"/>
            <line x1="17" y1="35" x2="12" y2="35"/>
            <line x1="20" y1="49" x2="16" y2="53"/>
            <line x1="52" y1="22" x2="56" y2="18"/>
          </g>
          <!-- Cloud -->
          <ellipse cx="58" cy="55" rx="22" ry="15" fill="url(#cloudGrad)"/>
          <ellipse cx="44" cy="59" rx="16" ry="12" fill="url(#cloudGrad)"/>
          <ellipse cx="68" cy="60" rx="12" ry="10" fill="url(#cloudGrad)"/>
          <!-- Wind lines -->
          <g stroke="url(#windGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8">
            <path d="M28 72 Q40 68 55 72"/>
            <path d="M35 79 Q48 75 60 79"/>
          </g>
          <defs>
            <linearGradient id="circleBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#1a6fd4"/>
            </linearGradient>
            <radialGradient id="sunGrad" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stop-color="#fde68a"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </radialGradient>
            <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#dbeafe"/>
            </linearGradient>
            <linearGradient id="windGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
              <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.2"/>
            </linearGradient>
          </defs>
        </svg>

        <div class="logo-text-group">
          <div class="logo-name">Weatherl<span>y</span></div>
          <div class="logo-tagline">Your Weather. Your Way.</div>
        </div>
      </div>

      <button class="toggle-btn" id="themeToggle" title="Toggle dark/light mode" aria-label="Toggle theme">🌙</button>
    </header>

    <!-- ===== SEARCH ===== -->
    <div class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search city, e.g. Mumbai, London..." autocomplete="off" />
        <button class="btn btn-primary" id="searchBtn">Search</button>
      </div>

      <div class="search-actions">
        <button class="btn btn-location" id="locationBtn">
          <span>📍</span> Use My Location
        </button>
      </div>

      <div id="recentSearches" class="recent-searches" style="display:none;"></div>
      <div id="errorMsg" class="error-msg">⚠️ City not found. Please check the name and try again.</div>
    </div>

    <!-- ===== LOADING ===== -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">Fetching weather data…</div>
    </div>

    <!-- ===== WEATHER CONTENT ===== -->
    <div id="weatherContent">

      <!-- Current Weather -->
      <div class="current-card" id="currentCard">
        <div>
          <div class="current-location" id="currentLocation"></div>
          <div class="current-city" id="currentCity"></div>
          <div class="current-country" id="currentCountry"></div>
          <div class="current-temp" id="currentTemp"></div>
          <div class="current-condition" id="currentCondition"></div>
          <div class="current-feels" id="currentFeels"></div>
          <div class="quick-stats" id="quickStats"></div>
        </div>
        <div class="current-icon-area">
          <img id="currentIcon" src="" alt="Weather icon" />
        </div>
      </div>

      <!-- Detail Cards -->
      <div class="section-title">Details</div>
      <div class="details-grid" id="detailsGrid"></div>

      <!-- Sunrise / Sunset -->
      <div class="section-title">Sun</div>
      <div class="sun-card" id="sunCard"></div>

      <!-- Hourly Forecast -->
      <div class="section-title">Hourly Forecast</div>
      <div class="hourly-scroll" id="hourlyScroll"></div>

      <!-- 5-Day Forecast -->
      <div class="section-title">5-Day Forecast</div>
      <div class="forecast-grid" id="forecastGrid"></div>

    </div>

    <!-- Welcome state shown initially -->
    <div class="welcome-state" id="welcomeState">
      <div class="w-icon">⛅</div>
      <h2>Welcome to Weatherly</h2>
      <p>Search a city or use your location to get started.</p>
    </div>

  </div><!-- end .wrapper -->

  <script>
    // =============================================
    // CONFIGURATION
    // =============================================
    const API_KEY = "fc0a9f57d6c9d6b1d55de60e5162d2ab";
    const BASE    = "https://api.openweathermap.org/data/2.5";
    const ICON    = (code, size = "@2x") => `https://openweathermap.org/img/wn/${code}${size}.png`;

    // =============================================
    // STATE
    // =============================================
    let recentSearches = JSON.parse(localStorage.getItem("wly_recent") || "[]");
    let isDark = localStorage.getItem("wly_theme") === "dark";

    // =============================================
    // DOM REFS
    // =============================================
    const searchInput   = document.getElementById("searchInput");
    const searchBtn     = document.getElementById("searchBtn");
    const locationBtn   = document.getElementById("locationBtn");
    const themeToggle   = document.getElementById("themeToggle");
    const errorMsg      = document.getElementById("errorMsg");
    const loadingOverlay= document.getElementById("loadingOverlay");
    const weatherContent= document.getElementById("weatherContent");
    const welcomeState  = document.getElementById("welcomeState");
    const recentEl      = document.getElementById("recentSearches");
    const currentIcon   = document.getElementById("currentIcon");

    // =============================================
    // THEME
    // =============================================
    function applyTheme() {
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      themeToggle.textContent = isDark ? "☀️" : "🌙";
    }

    themeToggle.addEventListener("click", () => {
      isDark = !isDark;
      localStorage.setItem("wly_theme", isDark ? "dark" : "light");
      applyTheme();
    });

    applyTheme();

    // =============================================
    // SEARCH HANDLERS
    // =============================================
    searchBtn.addEventListener("click", () => {
      const city = searchInput.value.trim();
      if (city) fetchWeatherByCity(city);
    });

    searchInput.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        const city = searchInput.value.trim();
        if (city) fetchWeatherByCity(city);
      }
    });

    locationBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        showError("Geolocation is not supported by your browser.");
        return;
      }
      setLoading(true);
      navigator.geolocation.getCurrentPosition(
        pos => fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude),
        () => { setLoading(false); showError("Location access denied. Please allow location permission."); }
      );
    });

    // =============================================
    // RECENT SEARCHES
    // =============================================
    function renderRecent() {
      if (!recentSearches.length) { recentEl.style.display = "none"; return; }
      recentEl.style.display = "flex";
      recentEl.innerHTML = `<div class="recent-label">Recent</div>`;
      recentSearches.forEach(city => {
        const chip = document.createElement("button");
        chip.className = "recent-chip";
        chip.textContent = city;
        chip.addEventListener("click", () => { searchInput.value = city; fetchWeatherByCity(city); });
        recentEl.appendChild(chip);
      });
    }

    function addRecent(city) {
      recentSearches = recentSearches.filter(c => c.toLowerCase() !== city.toLowerCase());
      recentSearches.unshift(city);
      if (recentSearches.length > 5) recentSearches.pop();
      localStorage.setItem("wly_recent", JSON.stringify(recentSearches));
      renderRecent();
    }

    renderRecent();

    // =============================================
    // LOADING / ERROR STATES
    // =============================================
    function setLoading(state) {
      loadingOverlay.classList.toggle("show", state);
      weatherContent.classList.toggle("show", false);
      welcomeState.style.display = state ? "none" : "";
      searchBtn.disabled = state;
      locationBtn.disabled = state;
      if (state) hideError();
    }

    function showError(msg) {
      errorMsg.textContent = "⚠️ " + msg;
      errorMsg.classList.add("show");
      welcomeState.style.display = "block";
      weatherContent.classList.remove("show");
    }
    function hideError() { errorMsg.classList.remove("show"); }

    // =============================================
    // FETCH WEATHER
    // =============================================
    async function fetchWeatherByCity(city) {
      setLoading(true);
      try {
        const [cur, fore] = await Promise.all([
          apiFetch(`${BASE}/weather?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`),
          apiFetch(`${BASE}/forecast?q=${encodeURIComponent(city)}&units=metric&appid=${API_KEY}`)
        ]);
        addRecent(cur.name);
        renderWeather(cur, fore);
        setLoading(false);
        welcomeState.style.display = "none";
        weatherContent.classList.add("show");
      } catch (e) {
        setLoading(false);
        showError(e.message || "City not found. Please try again.");
      }
    }

    async function fetchWeatherByCoords(lat, lon) {
      try {
        const [cur, fore] = await Promise.all([
          apiFetch(`${BASE}/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`),
          apiFetch(`${BASE}/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`)
        ]);
        searchInput.value = cur.name;
        addRecent(cur.name);
        renderWeather(cur, fore);
        setLoading(false);
        welcomeState.style.display = "none";
        weatherContent.classList.add("show");
      } catch (e) {
        setLoading(false);
        showError(e.message || "Failed to fetch location weather.");
      }
    }

    async function apiFetch(url) {
      const res = await fetch(url);
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.message || `Error ${res.status}`);
      }
      return res.json();
    }

    // =============================================
    // BACKGROUND BASED ON CONDITION
    // =============================================
    function setBackground(conditionMain) {
      const map = {
        Clear: "bg-clear",
        Clouds: "bg-clouds",
        Rain: "bg-rain",
        Drizzle: "bg-rain",
        Thunderstorm: "bg-thunderstorm",
        Snow: "bg-snow",
        Mist: "bg-mist",
        Smoke: "bg-mist",
        Haze: "bg-mist",
        Fog: "bg-mist",
        Dust: "bg-mist",
        Sand: "bg-mist",
        Ash: "bg-mist",
        Squall: "bg-clouds",
        Tornado: "bg-thunderstorm"
      };
      // Remove existing bg classes
      document.body.classList.remove(...Object.values(map));
      const cls = map[conditionMain] || "bg-clear";
      document.body.classList.add(cls);
    }

    // =============================================
    // FORMAT HELPERS
    // =============================================
    const round = n => Math.round(n);
    const toTime = ts => {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    };
    const toDayName = ts => new Date(ts * 1000).toLocaleDateString([], { weekday: "short" });
    const toHour = ts => {
      const d = new Date(ts * 1000);
      return d.toLocaleTimeString([], { hour: "numeric", hour12: true });
    };
    const visibilityKm = m => (m / 1000).toFixed(1) + " km";
    const windDir = deg => {
      const dirs = ["N","NE","E","SE","S","SW","W","NW"];
      return dirs[Math.round(deg / 45) % 8];
    };

    // =============================================
    // RENDER WEATHER
    // =============================================
    function renderWeather(cur, fore) {
      setBackground(cur.weather[0].main);

      // Current card
      document.getElementById("currentLocation").textContent = "📍 Current Location";
      document.getElementById("currentCity").textContent    = cur.name;
      document.getElementById("currentCountry").textContent = cur.sys.country;
      document.getElementById("currentTemp").textContent    = `${round(cur.main.temp)}°C`;
      document.getElementById("currentCondition").textContent = cur.weather[0].description;
      document.getElementById("currentFeels").textContent   = `Feels like ${round(cur.main.feels_like)}°C`;
      currentIcon.src = ICON(cur.weather[0].icon);
      currentIcon.alt = cur.weather[0].description;

      // Quick stats strip
      document.getElementById("quickStats").innerHTML = `
        <div class="qs-item"><span class="qs-icon">💧</span><div><div class="qs-label">Humidity</div><div class="qs-val">${cur.main.humidity}%</div></div></div>
        <div class="qs-item"><span class="qs-icon">💨</span><div><div class="qs-label">Wind</div><div class="qs-val">${round(cur.wind.speed)} m/s</div></div></div>
        <div class="qs-item"><span class="qs-icon">🌡️</span><div><div class="qs-label">Pressure</div><div class="qs-val">${cur.main.pressure} hPa</div></div></div>
        <div class="qs-item"><span class="qs-icon">👁️</span><div><div class="qs-label">Visibility</div><div class="qs-val">${visibilityKm(cur.visibility)}</div></div></div>
      `;

      // Detail cards
      const details = [
        { icon: "💧", label: "Humidity",    value: `${cur.main.humidity}%`,           sub: cur.main.humidity > 70 ? "High" : cur.main.humidity > 40 ? "Moderate" : "Low" },
        { icon: "💨", label: "Wind Speed",  value: `${round(cur.wind.speed)} m/s`,    sub: `Direction ${windDir(cur.wind.deg || 0)}` },
        { icon: "🌡️", label: "Pressure",    value: `${cur.main.pressure}`,             sub: "hPa" },
        { icon: "👁️", label: "Visibility",  value: visibilityKm(cur.visibility),       sub: cur.visibility >= 10000 ? "Clear" : "Reduced" },
        { icon: "🤔", label: "Feels Like",  value: `${round(cur.main.feels_like)}°C`, sub: cur.main.feels_like < cur.main.temp ? "Colder than actual" : "Same as actual" },
        { icon: "☁️", label: "Cloud Cover", value: `${cur.clouds.all}%`,              sub: cur.clouds.all > 70 ? "Overcast" : cur.clouds.all > 30 ? "Partly Cloudy" : "Clear" }
      ];

      document.getElementById("detailsGrid").innerHTML = details.map(d => `
        <div class="detail-card">
          <div class="detail-icon">${d.icon}</div>
          <div class="detail-label">${d.label}</div>
          <div class="detail-value">${d.value}</div>
          <div class="detail-sub">${d.sub}</div>
        </div>
      `).join("");

      // Sunrise / Sunset
      document.getElementById("sunCard").innerHTML = `
        <div class="sun-item">
          <div class="sun-icon">🌅</div>
          <div class="sun-label">Sunrise</div>
          <div class="sun-time">${toTime(cur.sys.sunrise)}</div>
        </div>
        <div class="sun-divider"></div>
        <div class="sun-item">
          <div class="sun-icon">🌇</div>
          <div class="sun-label">Sunset</div>
          <div class="sun-time">${toTime(cur.sys.sunset)}</div>
        </div>
      `;

      // Hourly (next 8 entries from 3-hour forecast)
      const hourlyItems = fore.list.slice(0, 8);
      document.getElementById("hourlyScroll").innerHTML = hourlyItems.map(h => `
        <div class="hourly-card">
          <div class="hourly-time">${toHour(h.dt)}</div>
          <img src="${ICON(h.weather[0].icon)}" alt="${h.weather[0].description}" loading="lazy"/>
          <div class="hourly-temp">${round(h.main.temp)}°</div>
        </div>
      `).join("");

      // 5-day forecast (pick noon entry per day, max 5 days)
      const dailyMap = {};
      fore.list.forEach(item => {
        const day = new Date(item.dt * 1000).toDateString();
        if (!dailyMap[day]) dailyMap[day] = { items: [] };
        dailyMap[day].items.push(item);
      });
      const days = Object.keys(dailyMap).slice(0, 5);
      document.getElementById("forecastGrid").innerHTML = days.map(day => {
        const items = dailyMap[day].items;
        const temps = items.map(i => i.main.temp);
        const maxT = Math.max(...temps);
        const minT = Math.min(...temps);
        // Pick midday or middle item
        const mid = items[Math.floor(items.length / 2)];
        const dayLabel = toDayName(mid.dt);
        return `
          <div class="forecast-card">
            <div class="forecast-day">${dayLabel}</div>
            <img src="${ICON(mid.weather[0].icon)}" alt="${mid.weather[0].description}" loading="lazy"/>
            <div class="forecast-condition">${mid.weather[0].description}</div>
            <div class="forecast-temps">
              <span class="forecast-max">${round(maxT)}°</span>
              <span class="forecast-min">${round(minT)}°</span>
            </div>
          </div>
        `;
      }).join("");
    }

  </script>
</body>
</html>
